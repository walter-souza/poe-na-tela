name: Deploy Backend to VPS

on:
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Executar Deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Verificando serviços de infraestrutura (LiveKit + SSL)..."
            cd ~/app-stack && docker compose up -d

            echo "🚀 Iniciando deploy do Backend na VPS..."
            cd ~/poe-na-tela/server || exit 1
            git pull origin ${{ github.ref_name }}
            npm install
            npm run build
            pm2 restart backend || pm2 start dist/index.js --name "backend"
            echo "✅ Deploy do backend e infraestrutura finalizados com sucesso!"
