name: Deploy Backend (Develop / Staging) to VPS

on:
  push:
    branches:
      - develop
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend-dev.yml'

jobs:
  deploy-dev:
    name: Deploy Backend Develop
    runs-on: ubuntu-latest

    steps:
      - name: Validar credenciais SSH (sem expor o valor)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
        run: |
          [ -n "$VPS_HOST" ] || { echo "::error::Segredo VPS_HOST vazio ou ausente"; exit 1; }
          [ -n "$VPS_USERNAME" ] || { echo "::error::Segredo VPS_USERNAME vazio ou ausente"; exit 1; }
          [ -n "$VPS_SSH_KEY" ] || { echo "::error::Segredo VPS_SSH_KEY vazio ou ausente neste job"; exit 1; }
          first=$(printf '%s' "$VPS_SSH_KEY" | head -n1 | tr -d '\r')
          last=$(printf '%s' "$VPS_SSH_KEY" | tail -n1 | tr -d '\r')
          lines=$(printf '%s\n' "$VPS_SSH_KEY" | wc -l)
          echo "Chave: $lines linhas | primeira: $first | ultima: $last"
          [ "$first" = "-----BEGIN OPENSSH PRIVATE KEY-----" ] || { echo "::error::Primeira linha da chave inesperada"; exit 1; }
          [ "$last" = "-----END OPENSSH PRIVATE KEY-----" ] || { echo "::error::Ultima linha da chave inesperada"; exit 1; }

      - name: Executar Deploy via SSH na VPS (Develop)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::Chave privada ilegivel pelo ssh-keygen"; exit 1; }
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 "$VPS_USERNAME@$VPS_HOST" 'bash -s' -- "$REF_NAME" <<'REMOTE'
          set -e
          echo "🚀 Verificando serviços de infraestrutura (LiveKit + SSL)..."
          cd ~/app-stack && docker compose up -d

          echo "🧪 Iniciando deploy do Backend DEV na VPS..."
          cd ~/poe-na-tela-dev/server
          git fetch origin develop
          git reset --hard FETCH_HEAD
          export PATH="/root/.nvm/versions/node/v20.20.2/bin:$PATH"
          npm ci
          npm run build
          pm2 delete backend-dev || true
          pm2 start dist/index.js --name "backend-dev" --cwd /root/poe-na-tela-dev/server --interpreter /root/.nvm/versions/node/v20.20.2/bin/node
          echo "✅ Deploy do backend de desenvolvimento (develop) finalizado com sucesso!"
          REMOTE
