name: Release Desktop (Windows)

# Gera o instalador do app desktop quando uma tag vX.Y.Z é publicada (ver VERSIONING.md).
# Também pode ser disparado manualmente para testar o build sem publicar release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build instalador (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Instalar dependências
        run: |
          npm ci --prefix client
          npm ci --prefix desktop

      - name: Baixar ffmpeg (sidecar)
        run: npm run fetch:ffmpeg --prefix desktop

      - name: Testes do app desktop (Rust)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Gerar instalador
        run: npm run build --prefix desktop

      - uses: actions/upload-artifact@v4
        with:
          name: poe-na-tela-desktop-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
